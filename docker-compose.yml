version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: converseiq-postgres
    restart: always
    environment:
      POSTGRES_USER: converseiq
      POSTGRES_PASSWORD: converseiq_secure_password
      POSTGRES_DB: converseiq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U converseiq -d converseiq_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: converseiq-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://converseiq:converseiq_secure_password@postgres:5432/converseiq_db
      SECRET_KEY: ${SECRET_KEY:-converseiq_super_secret_jwt_key_phase2_production_2026}
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: converseiq-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
